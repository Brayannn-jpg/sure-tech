<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="index.html">Mi Página</a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Inicio</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="contacto.html">Contacto</a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<div class="container mt-4">

    <h1>Formulario de Contacto</h1>

    <form>

        <h4>Datos Personales</h4>

        <div class="row">

            <div class="col-12 col-md-6">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control">
            </div>

            <div class="col-12 col-md-6">
                <label class="form-label">Apellidos</label>
                <input type="text" class="form-control">
            </div>

        </div>

        <br>

        <label class="form-label">RUT</label>
        <input type="text" class="form-control"
               placeholder="12.345.678-9" required>

        <br>

        <label class="form-label">Correo</label>
        <input type="email" class="form-control">
        <div class="form-text">El correo no será compartido.</div>

        <br>

        <label class="form-label">Teléfono</label>

        <div class="input-group">
            <span class="input-group-text">+56 9</span>
            <input type="tel" class="form-control">
        </div>

        <br>

        <h4>Información</h4>

        <label class="form-label">Región</label>

        <select class="form-select">
            <option selected disabled>Seleccione una región</option>
            <option>Los Ríos</option>
            <option>Los Lagos</option>
            <option>Biobío</option>
            <option>La Araucanía</option>
        </select>

        <br>

        <label class="form-label">Fecha</label>
        <input type="date" class="form-control">

        <br>

        <label class="form-label">Tipo de Consulta</label>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="consulta">
            <label class="form-check-label">Información</label>
        </div>

        <div class="form-check">
            <input class="form-check-input" type="radio" name="consulta">
            <label class="form-check-label">Soporte</label>
        </div>

        <br>

        <label class="form-label">Nivel de Interés</label>
        <input type="range" class="form-range">

        <br>

        <label class="form-label">Adjuntar archivo</label>
        <input type="file" class="form-control">

        <br>

        <label class="form-label">Comentarios</label>
        <textarea class="form-control" rows="4"></textarea>

        <br>

        <div class="form-check">
            <input class="form-check-input" type="checkbox" required>
            <label class="form-check-label">
                Acepto los <a href="#">Términos y Condiciones</a>
            </label>
        </div>

        <br>

        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">
                Suscribirme al boletín
            </label>
        </div>

        <br>

        <div class="d-flex justify-content-end gap-2">

            <button type="reset" class="btn btn-outline-secondary">
                Limpiar
            </button>

            <button type="submit" class="btn btn-primary">
                Enviar
            </button>

        </div>

    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
